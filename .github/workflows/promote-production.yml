name: Promote Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Git SHA already validated in staging.
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-production:
    permissions:
      contents: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/kubernetes-gitops-production-promotion.yml@v1.8.0
    secrets: inherit
    with:
      image_tag: ${{ inputs.image_tag }}
